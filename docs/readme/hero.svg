<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="A laptop whose desktop continues onto an Android tablet: a window glides from the laptop to the tablet, a pen writes and a finger taps on the tablet.">
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .glide { animation: glide 7s ease-in-out infinite; }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 6s ease-in-out -2s infinite; }
    .float3 { animation: float 6s ease-in-out -3.5s infinite; }
    .link { animation: dash 1.2s linear infinite; }
    .pen { stroke-dasharray: 260; animation: draw 5s ease-in-out 1s infinite both; }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 2.6s ease-out infinite; }
    .glow1 { animation: glow 8s ease-in-out infinite; }
    .glow2 { animation: glow 8s ease-in-out -4s infinite; }
    .p { animation: rise 5.5s ease-out infinite both; }
    @keyframes glide { 0%, 12% { transform: translate(0, 0); } 45%, 62% { transform: translate(560px, 168px); } 95%, 100% { transform: translate(0, 0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes draw { 0% { stroke-dashoffset: 260; opacity: 1; } 45%, 80% { stroke-dashoffset: 0; opacity: 1; } 92%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes ripple { 0% { transform: scale(0.2); opacity: 0.9; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes glow { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-140px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="gViolet"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="gCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="lapScreen" cx="0.1" cy="0" r="1.2"><stop offset="0" stop-color="#4c3fb8"/><stop offset="0.45" stop-color="#211c63"/><stop offset="1" stop-color="#120f36"/></radialGradient>
    <radialGradient id="tabScreen" cx="0.9" cy="0.1" r="1.2"><stop offset="0" stop-color="#1d6f8f"/><stop offset="0.45" stop-color="#1a2a6b"/><stop offset="1" stop-color="#100e33"/></radialGradient>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34307a"/><stop offset="1" stop-color="#17153d"/></linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/></pattern>
    <clipPath id="card"><rect width="1200" height="560" rx="28"/></clipPath>
    <clipPath id="tabClip"><rect x="714" y="264" width="372" height="232" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="560" fill="#0b0a24"/>
    <rect width="1200" height="560" fill="url(#dots)"/>
    <circle class="glow1" cx="340" cy="210" r="330" fill="url(#gViolet)"/>
    <circle class="glow2" cx="930" cy="430" r="300" fill="url(#gCyan)"/>

    <!-- link between the devices -->
    <path class="link" d="M 690 466 C 700 540, 770 548, 812 512" fill="none" stroke="url(#brand)" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>

    <!-- laptop -->
    <rect x="120" y="70" width="600" height="380" rx="16" fill="#14123a" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="134" y="84" width="572" height="352" rx="9" fill="url(#lapScreen)"/>
    <rect x="490" y="120" width="190" height="150" rx="8" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.15"/>
    <rect x="455" y="160" width="190" height="150" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.2"/>
    <rect x="160" y="110" width="22" height="22" rx="5" fill="#8b5cf6"/>
    <rect x="160" y="148" width="22" height="22" rx="5" fill="#22d3ee"/>
    <rect x="160" y="186" width="22" height="22" rx="5" fill="#fbbf24"/>
    <rect x="134" y="398" width="572" height="38" fill="#000000" fill-opacity="0.35"/>
    <rect x="356" y="408" width="18" height="18" rx="4" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="386" y="408" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="416" y="408" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="446" y="408" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="476" y="408" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="84" y="450" width="672" height="18" rx="9" fill="url(#base)"/>
    <rect x="370" y="450" width="100" height="6" rx="3" fill="#000000" fill-opacity="0.3"/>

    <!-- tablet -->
    <g class="float">
      <rect x="700" y="250" width="400" height="260" rx="26" fill="#0d0c26" stroke="#ffffff" stroke-opacity="0.22"/>
      <rect x="714" y="264" width="372" height="232" rx="12" fill="url(#tabScreen)"/>
      <g clip-path="url(#tabClip)">
        <rect x="744" y="290" width="150" height="80" rx="8" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.15"/>
        <rect x="954" y="380" width="110" height="70" rx="8" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.15"/>
        <rect x="714" y="470" width="372" height="26" fill="#000000" fill-opacity="0.35"/>
        <rect x="872" y="477" width="12" height="12" rx="3" fill="#22d3ee" fill-opacity="0.85"/>
        <rect x="894" y="477" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.35"/>
        <rect x="916" y="477" width="12" height="12" rx="3" fill="#ffffff" fill-opacity="0.35"/>
        <!-- the S-Pen writes, a finger taps -->
        <path class="pen" d="M 880 430 C 900 392, 920 388, 934 412 S 962 444, 980 410 S 1012 380, 1040 408" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
        <circle class="ripple" cx="790" cy="420" r="14" fill="none" stroke="#c4b5fd" stroke-width="3"/>
        <circle cx="790" cy="420" r="6" fill="#c4b5fd"/>
      </g>
    </g>

    <!-- the window dragged from the laptop onto the tablet -->
    <g class="glide">
      <rect x="230" y="150" width="180" height="124" rx="10" fill="#f4f2ff" stroke="#ffffff" stroke-opacity="0.3"/>
      <path d="M 240 150 h 160 a 10 10 0 0 1 10 10 v 10 h -180 v -10 a 10 10 0 0 1 10 -10 z" fill="url(#brand)"/>
      <circle cx="244" cy="160" r="3.5" fill="#ffffff" fill-opacity="0.85"/>
      <circle cx="256" cy="160" r="3.5" fill="#ffffff" fill-opacity="0.65"/>
      <circle cx="268" cy="160" r="3.5" fill="#ffffff" fill-opacity="0.45"/>
      <rect x="246" y="184" width="104" height="8" rx="4" fill="#c9c3f5"/>
      <rect x="246" y="198" width="140" height="8" rx="4" fill="#e2def9"/>
      <rect x="250" y="236" width="20" height="26" rx="3" fill="url(#bars)"/>
      <rect x="280" y="222" width="20" height="40" rx="3" fill="url(#bars)"/>
      <rect x="310" y="230" width="20" height="32" rx="3" fill="url(#bars)"/>
      <rect x="340" y="214" width="20" height="48" rx="3" fill="url(#bars)"/>
      <rect x="370" y="226" width="20" height="36" rx="3" fill="url(#bars)"/>
      <path d="M 300 156 l 0 24 l 6 -6 l 5 11 l 4 -2 l -5 -10 l 8 0 z" fill="#ffffff" stroke="#06051a" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- chips -->
    <g class="float2">
      <rect x="840" y="70" width="270" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M 866 80 l -9 14 h 8 l -3 12 l 11 -16 h -8 z" fill="#22d3ee"/>
      <text x="886" y="98" font-size="17" font-weight="600" fill="#eeecff">60 fps · hardware H.264</text>
    </g>
    <g class="float3">
      <rect x="40" y="492" width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <path d="M 62 524 l 4 -12 l 12 -12 l 8 8 l -12 12 z" fill="none" stroke="#a78bfa" stroke-width="2.4" stroke-linejoin="round"/>
      <text x="92" y="520" font-size="17" font-weight="600" fill="#eeecff">Touch &amp; S-Pen</text>
    </g>
    <g class="float2">
      <rect x="880" y="160" width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="904" cy="182" r="5" fill="#34d399"/>
      <text x="920" y="188" font-size="17" font-weight="600" fill="#eeecff">USB or Wi-Fi</text>
    </g>

    <!-- drifting particles -->
    <circle class="p" style="animation-delay:0s" cx="300" cy="530" r="4" fill="#a78bfa"/>
    <circle class="p" style="animation-delay:1.6s" cx="580" cy="540" r="4" fill="#22d3ee"/>
    <circle class="p" style="animation-delay:3.1s" cx="790" cy="330" r="4" fill="#a78bfa"/>
    <circle class="p" style="animation-delay:0.8s" cx="1130" cy="280" r="4" fill="#67e8f9"/>
    <circle class="p" style="animation-delay:2.4s" cx="420" cy="380" r="4" fill="#22d3ee"/>
    <circle class="p" style="animation-delay:4s" cx="80" cy="300" r="4" fill="#a78bfa"/>
  </g>
</svg>
