name: macOS host

on:
  push:
    branches: [main]
    paths: ['PlexiChore-Mac/**', 'PROTOCOL.md', '.github/workflows/mac.yml']
  pull_request:
    paths: ['PlexiChore-Mac/**', 'PROTOCOL.md', '.github/workflows/mac.yml']
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Intel image: hosted macOS arm64 runners repeatedly failed to be acquired ("capacity constraints").
    # The universal build compiles both architectures either way.
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PlexiChore-Mac
    steps:
      - uses: actions/checkout@v4

      # The sources track the newest SDK; use the newest stable Xcode on the image.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      # Package.swift is swift-tools-version 5.9 (Xcode 15+); no package dependencies, so nothing to cache.
      - name: swift build (debug + tests)
        run: swift build --build-tests

      - name: swift test
        run: swift test --skip-build

      - name: Fake tablet tool tests (no real ports)
        run: python3 tools/faketablet/test_faketablet.py -v

      - name: Build universal app (ad-hoc signed, not notarized)
        env:
          UNIVERSAL: '1'
          SIGN_IDENTITY: '-'
          BUILD_NUMBER: ${{ github.run_number }}
          OUT_DIR: ${{ github.workspace }}/PlexiChore-Mac/build
        run: |
          bash scripts/build-app.sh
          lipo -archs build/PlexiChore.app/Contents/MacOS/PlexiChore | grep -q arm64
          lipo -archs build/PlexiChore.app/Contents/MacOS/PlexiChore | grep -q x86_64
          codesign --verify --deep --strict --verbose=2 build/PlexiChore.app
          codesign -dv build/PlexiChore.app 2>&1 | grep 'flags=.*runtime'   # no -q: avoids SIGPIPE under pipefail
          plutil -p build/PlexiChore.app/Contents/Info.plist
          ditto -c -k --keepParent build/PlexiChore.app.dSYM build/PlexiChore.app.dSYM.zip

      - name: Package DMG
        run: bash scripts/package-dmg.sh build/PlexiChore.app

      - uses: actions/upload-artifact@v4
        with:
          name: PlexiChore-mac-unsigned-${{ github.run_number }}
          path: |
            PlexiChore-Mac/build/*.dmg
            PlexiChore-Mac/build/*.dmg.sha256
            PlexiChore-Mac/build/PlexiChore.app.dSYM.zip
          if-no-files-found: error
          retention-days: 14
